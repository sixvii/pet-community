<VirtualHost *:80>
    DocumentRoot /app/public
    SetEnvIf Authorization "(.+)" HTTP_AUTHORIZATION=$1

    <Directory /app/public>
        Options -Indexes
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
